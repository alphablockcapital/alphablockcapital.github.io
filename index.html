<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALPHA BLOCK CAPITAL | 3 LIVES MODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap');
        body { background: #020202; color: #fff; font-family: 'Space Grotesk', sans-serif; overflow-x: hidden; touch-action: manipulation; }
        .cyan-glow { text-shadow: 0 0 20px rgba(0, 242, 255, 0.6); color: #00f2ff; }
        .gold-glow { text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); border: 1px solid #ffd700; color: #ffd700; }
        .vanta-card { background: #080808; border: 1px solid #1a1a1a; border-radius: 12px; }
        #game-canvas { background: #000; border: 2px solid #1a1a1a; width: 100%; max-width: 400px; border-radius: 8px; }
        .touch-btn { width: 70px; height: 70px; background: rgba(255,255,255,0.03); border: 2px solid #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: 0.1s; user-select: none; }
        .btn-alpha { padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-size: 10px; }
    </style>
</head>
<body class="p-4 flex flex-col items-center">

    <header class="text-center mb-6">
        <img src="logo.jpg" alt="Alpha Logo" class="w-24 mx-auto mb-4 rounded-lg shadow-[0_0_30px_rgba(0,242,255,0.2)]">
        <h1 class="text-2xl font-bold cyan-glow uppercase tracking-tighter">Alpha Block Capital</h1>
    </header>

    <div class="vanta-card p-6 flex flex-col items-center w-full max-w-md">
        <h2 class="gold-glow mb-4 text-[10px] tracking-[0.4em] uppercase italic">187 Mode Survie</h2>
        <div class="flex gap-10 mb-4 font-mono text-sm">
            <div class="text-red-500 font-bold">VIES: <span id="lives">❤️❤️❤️</span></div>
            <div class="text-green-400 font-bold">SCORE: <span id="score">0</span></div>
        </div>
        <canvas id="game-canvas"></canvas>
        
        <div class="flex gap-8 mt-6">
            <div id="l" class="touch-btn">◀</div>
            <div id="s" class="touch-btn" style="border-color: #ffd700;">🔥</div>
            <div id="r" class="touch-btn">▶</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 400; canvas.height = 500;
        
        let player = {x: 180, y: 430, w: 40, h: 40, lives: 3, score: 0};
        let bullets = [], enemies = [], shake = 0, moveL = false, moveR = false;
        let isGameOver = false;

        const btnL = document.getElementById('l'), btnR = document.getElementById('r'), btnS = document.getElementById('s');
        btnL.onpointerdown = (e) => { e.preventDefault(); moveL = true; };
        btnL.onpointerup = () => moveL = false;
        btnR.onpointerdown = (e) => { e.preventDefault(); moveR = true; };
        btnR.onpointerup = () => moveR = false;
        btnS.onpointerdown = (e) => { e.preventDefault(); if(isGameOver) reset(); else shoot(); };

        function shoot() { bullets.push({x: player.x + 18, y: player.y, s: 12}); }
        function spawn() { if(!isGameOver) enemies.push({x: Math.random()*360, y: -40, s: 4+(player.score/5000), w: 35, h: 35}); }
        setInterval(spawn, 800);

        function reset() {
            player = {x: 180, y: 430, w: 40, h: 40, lives: 3, score: 0};
            bullets = []; enemies = []; isGameOver = false;
            document.getElementById('score').innerText = 0;
            document.getElementById('lives').innerText = "❤️❤️❤️";
        }

        function draw() {
            ctx.save();
            if (shake > 0) { ctx.translate(Math.random()*shake-shake/2, Math.random()*shake-shake/2); shake -= 0.7; }
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,400,500);

            if(isGameOver) {
                ctx.fillStyle = "#fff"; ctx.font = "20px Space Grotesk"; ctx.textAlign = "center";
                ctx.fillText("GAME OVER", 200, 220);
                ctx.fillText("TAPE FEU POUR RESTART", 200, 260);
            } else {
                if(moveL && player.x > 0) player.x -= 10;
                if(moveR && player.x < 360) player.x += 10;
                
                ctx.shadowBlur = 20; ctx.shadowColor = '#00f2ff';
                ctx.fillStyle = '#00f2ff'; ctx.fillRect(player.x, player.y, 40, 40);

                bullets.forEach((b, i) => {
                    b.y -= b.s; ctx.fillStyle = '#ffd700'; ctx.fillRect(b.x, b.y, 4, 15);
                    if(b.y < 0) bullets.splice(i, 1);
                });

                enemies.forEach((e, i) => {
                    e.y += e.s; ctx.fillStyle = '#ff4444'; ctx.fillRect(e.x, e.y, 35, 35);
                    
                    bullets.forEach((b, bi) => {
                        if(b.x < e.x+35 && b.x+4 > e.x && b.y < e.y+35) {
                            enemies.splice(i,1); bullets.splice(bi,1); player.score+=187; shake=8;
                            document.getElementById('score').innerText = player.score;
                        }
                    });

                    if( (e.x < player.x+40 && e.x+35 > player.x && e.y < player.y+40 && e.y+35 > player.y) || e.y > 500 ) {
                        enemies.splice(i,1); player.lives--; shake=15;
                        let hearts = ""; for(let k=0; k<player.lives; k++) hearts += "❤️";
                        document.getElementById('lives').innerText = hearts || "💀";
                        if(player.lives <= 0) isGameOver = true;
                    }
                });
            }
            ctx.restore();
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
